[api]
token =

[domains]
# resolved via the system resolver to decide whether an update is worth attempting.
# it should be one of the domains below, or the check never agrees and every run does a
# needless pass over the API.
primary = mydomain.com
# only these exact record names are updated. wildcards are not matched.
domain[] = mydomain.com
domain[] = www.mydomain.com

# public address lookup. any single one of these decides where your domains point,
# so prefer https:// -- a plaintext source lets anyone on the network path choose for you.
[ip]
url[] = https://checkip.amazonaws.com
url[] = https://ifconfig.co/ip
url[] = https://ifconfig.me/ip
url[] = https://ipecho.net/plain
