[api]
token =

[domains]
# only these exact record names are updated. wildcards are not matched.
domain[] = mydomain.com
domain[] = www.mydomain.com

# public address lookup. two of these must return the same address before it is published,
# so a single compromised or spoofed source cannot repoint your domains. list at least three
# so one being down does not stop updates, and prefer https:// -- a plaintext source lets
# anyone on the network path cast a vote.
[ip]
url[] = https://checkip.amazonaws.com
url[] = https://ifconfig.co/ip
url[] = https://ifconfig.me/ip
url[] = https://ipecho.net/plain

[schedule]
# seconds between update checks when running with --watch. the container does this.
interval = 300
